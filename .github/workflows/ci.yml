name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
      - run: uv venv .venv
      - run: uv pip install ruff
      - run: .venv/bin/ruff check src/ tests/
      - run: .venv/bin/ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
      - run: uv venv .venv
      - run: uv pip install -e ".[dev]" pytest-cov
      - run: .venv/bin/pytest tests/ -v --cov=skill_curator --cov-report=term-missing --cov-fail-under=70
