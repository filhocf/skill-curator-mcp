name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv venv .venv
      - run: uv pip install ruff
      - run: .venv/bin/ruff check src/ tests/
      - run: .venv/bin/ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv venv .venv
      - run: uv pip install -e ".[dev]" pytest-cov
      - run: .venv/bin/pytest tests/ -v --cov=skill_curator --cov-report=term-missing --cov-fail-under=70
