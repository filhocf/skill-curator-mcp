[project]
name = "skill-curator-mcp"
version = "0.1.0"
description = "Skill lifecycle intelligence MCP — semantic matching, feedback loop, gap detection, scout"
authors = [{name = "Claudio Ferreira Filho", email = "claudio.filho@dataprev.gov.br"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
skill-curator-mcp = "skill_curator.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_curator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
